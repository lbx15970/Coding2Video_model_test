# 用例模板：复制 cases/_template 为 cases/<case-id>/ 后填写
id: case-001
title: 占位标题
goal: 这条用例验证什么
source: 客户提供 / 自造

inputs:
  refs: []                        # cases/<id>/inputs/ 下的文件，或用 assets/refs/ 的公共素材
target:
  video: cases/<id>/targets/xxx.mp4   # 或 assets/targets/xxx.mp4
  why_good: 目标好在哪（构图/节奏/转场/信息密度）

prompt_file: prompt.md

output_spec:
  duration_s: 15
  resolution: 1080x1920
  fps: 30
  format: mp4

evals:
  must_have: []                   # 必须出现的信息点
  must_not: []                    # 禁止出现（水印/错字/版权素材）
