# Claude Opus 5.5 调用配置（走本 IDE 内置能力，无 endpoint/api_key）
model: claude-opus-5.5
access: ide_builtin
agent_entry: 本 IDE Agent（人工/半自动驱动，非脚本直调）
model_version: 待回填                    # 记录 IDE 实际暴露的版本号，保证可复现
generation_params:
  temperature: 0.7
  top_p: 1.0
  max_tokens: 8192
  thinking: 记录 IDE 实际开关状态

recording_rule:
  - 每次由 IDE 跑完后，把 prompt、完整回复、生成代码、产物时间戳写入对应 outputs/<run_id>/
  - 若 IDE 支持导出会话，原始会话一并存入 outputs/<run_id>/logs/
