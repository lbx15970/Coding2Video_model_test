# Doubao-Seed-Evolving 调用配置
# 密钥不写在 YAML 里：scripts/ark_client.py 会读取 models/seed-evolving/.env
model: ep-20260812154547-t8rmk        # Endpoint ID
region: cn-beijing
base_url: https://ark.cn-beijing.volces.com/api/v3
api_key_env: ARK_API_KEY
model_version: doubao-seed-evolving-latest-version   # 2026-10-29 冒烟测试响应回报，如有变动更新此处
api_path:
  chat: /chat/completions
  video_gen: /contents/generations/tasks   # 若该 endpoint 支持视频生成任务再启用

generation_params:                      # 每次任务可覆盖，覆盖值必须写入 run_meta.json
  temperature: 0.7
  top_p: 0.95
  max_tokens: 8192
  stream: false
  frequency_penalty: 0.0
  presence_penalty: 0.0

limits:
  timeout_s: 180
  max_retries: 2
